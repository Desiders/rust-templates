services:
  postgres:
    container_name: web_template.postgres
    image: "postgres:18-alpine"
    restart: "unless-stopped"
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - postgres.network
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_USER: ${POSTGRES_USER:?error}
      POSTGRES_DB: ${POSTGRES_DB:?error}
    volumes:
      - postgres.data:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 60s
      retries: 5
      start_period: 10s
    profiles:
      - default
      - dev
      - migration

  migrate:
    image: "${MIGRATION_IMAGE:-web-template-migration}"
    build:
      context: ../..
      dockerfile: web-template/migration/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?error}:${POSTGRES_PASSWORD:?error}@web_template.postgres:5432/${POSTGRES_DB:?error}
    command: ${MIGRATION_COMMAND:-up}
    networks:
      - postgres.network
    profiles:
      - migration

volumes:
  postgres.data: {}

networks:
  postgres.network: {}
