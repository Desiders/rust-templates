      properties:
        code:
          type: integer
          enum:
          - 1000
          examples:
          - 1000
        is_success:
          type: boolean
          enum:
          - false
          examples:
          - false
        message:
          type: string
          description: Human-readable error message
        name:
          type: string
          enum:
          - Unexpected
          examples:
          - Unexpected
    ErrResponse_UserAlreadyExists:
      type: object
      description: 'Error response: UserAlreadyExists (1004)'
      required:
      - is_success
      - code
      - name
      - message
      properties:
        code:
          type: integer
          enum:
          - 1004
          examples:
          - 1004
        is_success:
          type: boolean
          enum:
          - false
          examples:
          - false
        message:
          type: string
          description: Human-readable error message
        name:
          type: string
          enum:
          - UserAlreadyExists
