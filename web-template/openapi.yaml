    OkResponse_Status:
      type: object
      description: Successful JSON response structure
      required:
      - is_success
      - result
      properties:
        is_success:
          type: boolean
          enum:
          - true
          examples:
          - true
        result:
          type: object
          required:
          - status
          properties:
            status:
              type: string
    OkResponse_User:
      type: object
      description: Successful JSON response structure
      required:
      - is_success
      - result
      properties:
        is_success:
          type: boolean
          enum:
          - true
          examples:
          - true
        result:
          type: object
          required:
          - id
          - created_at
          - updated_at
          properties:
            created_at:
              type: string
              format: date-time
            id:
              type: string
              format: uuid
            updated_at:
              type: string
              format: date-time
            username:
              type:
              - string
              - 'null'
    OkResponse_Vec_User:
      type: object
      description: Successful JSON response structure
      required:
      - is_success
      - result
      properties:
        is_success:
          type: boolean
          enum:
          - true
          examples:
          - true
        result:
          type: array
          items:
            type: object
            required:
            - id
            - created_at
            - updated_at
            properties:
              created_at:
                type: string
                format: date-time
              id:
                type: string
                format: uuid
              updated_at:
                type: string
                format: date-time
              username:
                type:
                - string
                - 'null'
    OkResponse_str:
      type: object
      description: Successful JSON response structure
      required:
      - is_success
      - result
      properties:
        is_success:
          type: boolean
          enum:
