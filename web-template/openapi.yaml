    UserValidationResponse:
      oneOf:
      - $ref: '#/components/schemas/ErrResponse_InvalidUsername'
      - $ref: '#/components/schemas/ErrResponse_JsonRejection'
tags:
- name: health
  description: Process liveness
- name: users
  description: User example
